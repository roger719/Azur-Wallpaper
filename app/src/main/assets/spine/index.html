<!doctype html>
<html style="background: transparent !important; margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden">
<head>
    <meta charset="UTF-8" />
    <script src="lib/pixi.min.js"></script>
    <script src="lib/pixi-spine.umd.js"></script>
    <style>
        * { margin: 0; padding: 0; border: none; box-sizing: border-box; }
        html, body {
            background: transparent !important;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
        }
        #stage { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: transparent !important; }
        canvas { display: block; width: 100%; height: 100%; background: transparent !important; }
    </style>
</head>
<body style="background: transparent !important;">
    <div id="stage"></div>
    <script>
        let app = null;
        let model = null;
        let loadToken = 0;
        let pendingModelPath = null;
        let pendingAtlasPath = null;
        let currentLoadedPath = null;
        let currentlyLoadingPath = null;

        let customScale = 1.0;
        let customOffsetX = 0.0;
        let customOffsetY = 0.0;
        let isModelVisible = true;
        let isPointerTrackingEnabled = true;
        let isRenderingPaused = false;
        let isInitialized = false;
        let initAttempts = 0;

        function notifyAndroid(method, arg) {
            try {
                if (window.AzurSpine && typeof window.AzurSpine[method] === "function") {
                    if (arg === undefined) {
                        window.AzurSpine[method]();
                    } else {
                        window.AzurSpine[method](arg);
                    }
                }
            } catch (e) {
                console.error("notifyAndroid error:", e);
            }
        }

        function setCustomScale(scale) {
            if (typeof scale === "number" && !isNaN(scale) && scale > 0) {
                customScale = scale;
                fitModel();
            }
        }

        function setCustomOffset(offsetX, offsetY) {
            if (typeof offsetX === "number" && typeof offsetY === "number") {
                customOffsetX = offsetX;
                customOffsetY = offsetY;
                fitModel();
            }
        }

        function setPointerTrackingEnabled(enabled) {
            isPointerTrackingEnabled = !!enabled;
        }

        function setPointerPosition(x, y) {
            if (!isPointerTrackingEnabled || !model || !app) return;
            try {
                const screenW = app.renderer.screen.width;
                const screenH = app.renderer.screen.height;
                if (screenW <= 0 || screenH <= 0) return;
                const normX = (x / screenW - 0.5) * 2.0;
                const normY = (y / screenH - 0.5) * 2.0;

                // Subtle tilt towards pointer for lifelike interaction
                model.rotation = normX * 0.05;
            } catch (e) {}
        }

        function setModelVisible(visible) {
            isModelVisible = !!visible;
            if (app && app.stage) {
                app.stage.visible = isModelVisible;
                if (isModelVisible && app.renderer) {
                    app.renderer.render(app.stage);
                }
            }
        }

        let customIdleAnimation = "DEFAULT";

        function getEffectiveIdleAnimation() {
            if (!model || !model.state || !model.state.data || !model.state.data.skeletonData) return null;
            const anims = model.state.data.skeletonData.animations;
            if (!anims || anims.length === 0) return null;

            if (customIdleAnimation && customIdleAnimation !== "DEFAULT" && customIdleAnimation !== "NONE") {
                const targetLower = customIdleAnimation.toLowerCase();
                const matched = anims.find(a => a.name.toLowerCase() === targetLower)
                    || anims.find(a => a.name.toLowerCase().includes(targetLower));
                if (matched) return matched.name;
            }

            const defaultAnim = anims.find(n => {
                const l = n.name.toLowerCase();
                return l.includes("idle") || l.includes("stand") || l.includes("normal") || l.includes("wait");
            }) || anims[0];
            return defaultAnim ? defaultAnim.name : null;
        }

        function setIdleAnimation(animName) {
            customIdleAnimation = animName || "DEFAULT";
            const idle = getEffectiveIdleAnimation();
            if (model && model.state && idle) {
                model.state.setAnimation(0, idle, true);
                if (app && app.renderer) app.renderer.render(app.stage);
            }
        }

        function playNamedAnimation(animName) {
            if (!model || !animName) return;
            const cleanStr = String(animName).trim();
            if (!cleanStr || cleanStr.toUpperCase() === "NONE") return;

            try {
                let targetName = cleanStr;
                if (cleanStr.includes(",")) {
                    const list = cleanStr.split(",").map(s => s.trim()).filter(s => s.length > 0 && s.toUpperCase() !== "NONE");
                    if (list.length === 0) return;
                    targetName = list[Math.floor(Math.random() * list.length)];
                }

                if (!model.state || !model.state.data || !model.state.data.skeletonData) return;
                const anims = model.state.data.skeletonData.animations;
                if (!anims || anims.length === 0) return;

                const targetLower = targetName.toLowerCase();
                const matched = anims.find(a => a.name.toLowerCase() === targetLower)
                    || anims.find(a => a.name.toLowerCase().includes(targetLower) || targetLower.includes(a.name.toLowerCase()));

                if (matched) {
                    model.state.setAnimation(0, matched.name, false);
                    const returnAnim = getEffectiveIdleAnimation();
                    if (returnAnim) {
                        model.state.addAnimation(0, returnAnim, true, 0);
                    }
                }
            } catch (e) {
                console.error("Play named Spine animation error:", animName, e);
            }
        }

        function playActionAnimation() {
            // When no specific animation is configured, do not play any animation.
            return;
        }

        function fitModel() {
            if (!model || !app) return;
            const screenW = app.renderer.screen.width;
            const screenH = app.renderer.screen.height;
            if (screenW <= 0 || screenH <= 0) {
                requestAnimationFrame(fitModel);
                return;
            }

            if (typeof customScale !== "number" || isNaN(customScale) || customScale <= 0) customScale = 1.0;
            if (typeof customOffsetX !== "number" || isNaN(customOffsetX)) customOffsetX = 0.0;
            if (typeof customOffsetY !== "number" || isNaN(customOffsetY)) customOffsetY = 0.0;

            let bX = 0, bY = 0, bW = 0, bH = 0;
            try {
                const bounds = model.getLocalBounds();
                if (bounds && bounds.width > 20 && bounds.height > 20) {
                    bX = bounds.x;
                    bY = bounds.y;
                    bW = bounds.width;
                    bH = bounds.height;
                }
            } catch (e) {}

            if (bW <= 0 || bH <= 0) {
                if (model.spineData && model.spineData.width && model.spineData.height && model.spineData.width > 0) {
                    bX = model.spineData.x || 0;
                    bY = model.spineData.y || 0;
                    bW = model.spineData.width;
                    bH = model.spineData.height;
                } else {
                    bW = 800;
                    bH = 1200;
                    requestAnimationFrame(fitModel);
                }
            }

            if (model.pivot && typeof model.pivot.set === "function") {
                model.pivot.set(bX + bW / 2, bY + bH / 2);
            }

            const baseScale = Math.min(screenW / bW, screenH / bH) * 0.85;
            const finalScale = baseScale * customScale;

            model.scale.set(finalScale);

            const worldToScreenX = screenW / 800.0;
            const worldToScreenY = screenH / 1280.0;

            model.x = (screenW / 2) + (customOffsetX * worldToScreenX);
            model.y = (screenH / 2) - (customOffsetY * worldToScreenY);

            if (app && app.renderer) {
                app.renderer.render(app.stage);
            }
        }

        let currentPmaMode = false;
        let pendingPmaMode = false;

        function loadModelFromAndroid(modelPath, atlasPath, isPma) {
            let effectivePma = (isPma === true || isPma === "true" || isPma === 1);
            if (!effectivePma && modelPath) {
                const pLower = String(modelPath).toLowerCase();
                if (pLower.includes("project qt") || pLower.includes("projectqt") || pLower.includes("bikini%20girls")) {
                    effectivePma = true;
                }
            }
            currentPmaMode = effectivePma;
            if (!modelPath) return;
            if (!modelPath.startsWith("file://") && !modelPath.startsWith("http")) {
                modelPath = "file://" + modelPath;
            }
            if (atlasPath && !atlasPath.startsWith("file://") && !atlasPath.startsWith("http")) {
                atlasPath = "file://" + atlasPath;
            }

            if (modelPath === currentLoadedPath && model) {
                fitModel();
                notifyAndroid("onModelLoaded", modelPath);
                return;
            }
            if (modelPath === currentlyLoadingPath) {
                return;
            }
            currentlyLoadingPath = modelPath;
            currentAtlasPath = atlasPath;
            if (!app) {
                pendingModelPath = modelPath;
                pendingAtlasPath = atlasPath;
                pendingPmaMode = currentPmaMode;
                init();
                return;
            }
            loadSpineModel(modelPath, atlasPath, currentPmaMode);
        }

        function setPmaMode(isPma) {
            let effectivePma = (isPma === true || isPma === "true" || isPma === 1);
            if (!effectivePma && currentLoadedPath) {
                const pLower = String(currentLoadedPath).toLowerCase();
                if (pLower.includes("project qt") || pLower.includes("projectqt") || pLower.includes("bikini%20girls")) {
                    effectivePma = true;
                }
            }
            if (effectivePma === currentPmaMode) return;
            currentPmaMode = effectivePma;
            if (currentLoadedPath) {
                const targetModel = currentLoadedPath;
                const targetAtlas = currentAtlasPath;
                currentLoadedPath = null;
                currentlyLoadingPath = null;
                loadModelFromAndroid(targetModel, targetAtlas, currentPmaMode);
            }
        }

        let currentLoader = null;

        function loadSpineModel(modelPath, atlasPath, isPma) {
            const token = ++loadToken;
            const loaderKey = "spine_model_" + token;

            // Reset previous loader if running
            if (currentLoader && currentLoader.loading) {
                try {
                    currentLoader.reset();
                } catch (e) {}
            }

            const loader = new PIXI.Loader();
            currentLoader = loader;

            const options = {
                metadata: {}
            };
            if (isPma) {
                options.metadata.imageMetadata = {
                    alphaMode: PIXI.ALPHA_MODES.PMA
                };
            }
            if (atlasPath) {
                options.metadata.spineAtlasFile = atlasPath;
            }

            loader.add(loaderKey, modelPath, options);

            loader.load((_, resources) => {
                if (token !== loadToken) {
                    try { loader.reset(); } catch (e) {}
                    return;
                }

                const res = resources[loaderKey];
                if (!res || !res.spineData) {
                    console.error("Spine model failed to load spineData:", modelPath);
                    currentlyLoadingPath = null;
                    notifyAndroid("onModelError", modelPath);
                    notifyAndroid("onModelLoaded", modelPath);
                    try { loader.reset(); } catch (e) {}
                    return;
                }

                if (model) {
                    try {
                        app.stage.removeChild(model);
                        model.destroy({ children: true, texture: false, baseTexture: false });
                    } catch (e) {}
                }

                try {
                    // Respect explicit atlas pma flag if present; otherwise use the requested isPma mode
                    if (res.spineAtlas && res.spineAtlas.pages) {
                        res.spineAtlas.pages.forEach(page => {
                            if (page.baseTexture) {
                                if (page.pma === true) {
                                    page.baseTexture.alphaMode = PIXI.ALPHA_MODES.PMA;
                                } else if (page.pma === false) {
                                    page.baseTexture.alphaMode = PIXI.ALPHA_MODES.UNPACK;
                                } else if (isPma) {
                                    page.baseTexture.alphaMode = PIXI.ALPHA_MODES.PMA;
                                } else {
                                    page.baseTexture.alphaMode = PIXI.ALPHA_MODES.UNPACK;
                                }
                            }
                        });
                    }
                    if (res.spineData && res.spineData.images && isPma) {
                        for (const key in res.spineData.images) {
                            const tex = res.spineData.images[key];
                            if (tex && tex.baseTexture) {
                                tex.baseTexture.alphaMode = PIXI.ALPHA_MODES.PMA;
                            }
                        }
                    }

                    model = new PIXI.spine.Spine(res.spineData);
                    app.stage.addChild(model);
                    currentLoadedPath = modelPath;
                    currentlyLoadingPath = null;

                    // Collect animation names
                    const animNames = [];
                    if (model.state && model.state.data && model.state.data.skeletonData && model.state.data.skeletonData.animations) {
                        model.state.data.skeletonData.animations.forEach(a => {
                            if (a.name) animNames.push(a.name);
                        });
                    }
                    notifyAndroid("onAnimationsLoaded", JSON.stringify(animNames));

                    // Effective idle animation (custom selection or auto-detected default)
                    const idleAnim = getEffectiveIdleAnimation();
                    if (idleAnim) {
                        model.state.setAnimation(0, idleAnim, true);
                    }

                    fitModel();

                    if (app && app.stage) {
                        app.stage.visible = isModelVisible;
                    }
                    if (app && app.renderer) {
                        app.renderer.render(app.stage);
                    }

                    notifyAndroid("onModelLoaded", modelPath);

                    // Multi-frame fitting stabilization
                    requestAnimationFrame(() => {
                        fitModel();
                        if (app && app.renderer) app.renderer.render(app.stage);
                    });
                    setTimeout(() => {
                        fitModel();
                        if (app && app.renderer) app.renderer.render(app.stage);
                    }, 80);
                } catch (e) {
                    console.error("Spine initialization error:", e);
                    currentlyLoadingPath = null;
                    notifyAndroid("onModelError", modelPath);
                    notifyAndroid("onModelLoaded", modelPath);
                }
            });

            loader.onError.add((err) => {
                console.error("Loader error loading Spine model:", err);
                if (token === loadToken) {
                    currentlyLoadingPath = null;
                    notifyAndroid("onModelError", modelPath);
                    notifyAndroid("onModelLoaded", modelPath);
                }
            });
        }

        function pauseRendering() {
            isRenderingPaused = true;
            if (app && app.ticker && app.ticker.started) {
                app.ticker.stop();
            }
        }

        function resumeRendering() {
            isRenderingPaused = false;
            if (app && app.ticker && !app.ticker.started) {
                app.ticker.start();
            }
            fitModel();
        }

        function readStageSize() {
            const stage = document.getElementById("stage");
            let w = (stage && stage.clientWidth) || window.innerWidth || 0;
            let h = (stage && stage.clientHeight) || window.innerHeight || 0;
            if (w <= 1 && typeof screen !== "undefined" && screen.width) w = screen.width;
            if (h <= 1 && typeof screen !== "undefined" && screen.height) h = screen.height;
            return { w: w, h: h };
        }

        function resizeToContainer(explicitW, explicitH) {
            const measured = readStageSize();
            const w = explicitW || measured.w;
            const h = explicitH || measured.h;
            if (!app) {
                init();
                return;
            }
            if (w > 1 && h > 1) {
                const screen = app.renderer && app.renderer.screen;
                if (!screen || screen.width !== w || screen.height !== h) {
                    app.renderer.resize(w, h);
                }
                fitModel();
            }
        }

        async function init() {
            const stage = document.getElementById("stage");
            if (!stage) return;

            const size = readStageSize();
            if (isInitialized) {
                notifyAndroid("onEngineReady");
                if (size.w > 1 && size.h > 1) {
                    resizeToContainer(size.w, size.h);
                }
                return;
            }

            const initW = (size.w > 1) ? size.w : (window.innerWidth || 800);
            const initH = (size.h > 1) ? size.h : (window.innerHeight || 1280);

            isInitialized = true;

            app = new PIXI.Application({
                width: initW,
                height: initH,
                transparent: true,
                backgroundAlpha: 0,
                clearBeforeRender: true,
                preserveDrawingBuffer: true,
                antialias: true,
                autoDensity: true,
                resolution: window.devicePixelRatio || 1,
                sharedTicker: false
            });

            if (app.renderer && app.renderer.background) {
                app.renderer.background.alpha = 0;
            }
            stage.appendChild(app.view);

            if (app && app.stage) {
                app.stage.visible = isModelVisible;
            }

            notifyAndroid("onEngineReady");

            if (pendingModelPath) {
                const pendingModel = pendingModelPath;
                const pendingAtlas = pendingAtlasPath;
                const pendingPma = pendingPmaMode;
                pendingModelPath = null;
                pendingAtlasPath = null;
                pendingPmaMode = false;
                loadSpineModel(pendingModel, pendingAtlas, pendingPma);
            }
        }

        function setCustomBackground(type, value, scale, offsetX, offsetY) {
            const body = document.body;
            if (!body) return;

            if (type === "COLOR" && value) {
                body.style.backgroundImage = "none";
                body.style.backgroundColor = value;
            } else if (type === "IMAGE" && value) {
                body.style.backgroundColor = "transparent";
                body.style.backgroundImage = `url("${value}")`;
                const s = scale || 1.0;
                const ox = offsetX || 0;
                const oy = offsetY || 0;
                body.style.backgroundPosition = `calc(50% + ${ox}px) calc(50% + ${oy}px)`;
                body.style.backgroundSize = `${s * 100}% ${s * 100}%`;
                body.style.backgroundRepeat = "no-repeat";
            } else {
                body.style.backgroundImage = "none";
                body.style.backgroundColor = "transparent";
            }
        }

        window.setCustomScale = setCustomScale;
        window.setCustomOffset = setCustomOffset;
        window.setCustomBackground = setCustomBackground;
        window.setPointerPosition = setPointerPosition;
        window.setPointerTrackingEnabled = setPointerTrackingEnabled;
        window.setModelVisible = setModelVisible;
        window.setIdleAnimation = setIdleAnimation;
        window.setPmaMode = setPmaMode;
        window.playActionAnimation = playActionAnimation;
        window.playNamedAnimation = playNamedAnimation;
        window.pauseRendering = pauseRendering;
        window.resumeRendering = resumeRendering;
        window.resizeToContainer = resizeToContainer;
        window.loadModelFromAndroid = loadModelFromAndroid;
        window.init = init;

        window.addEventListener("resize", () => resizeToContainer());
        if (typeof ResizeObserver !== "undefined") {
            const stage = document.getElementById("stage");
            if (stage) {
                new ResizeObserver(() => resizeToContainer()).observe(stage);
            }
        }

        if (document.readyState === "complete" || document.readyState === "interactive") {
            setTimeout(init, 0);
        } else {
            document.addEventListener("DOMContentLoaded", init);
        }
    </script>
</body>
</html>
